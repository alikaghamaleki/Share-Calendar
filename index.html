<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقویم مشترک ما</title>
  
  <!-- کتابخانه‌های مورد نیاز (Tailwind و React) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- کتابخانه‌های فایربیس -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <style> body { font-family: Tahoma, Arial, sans-serif; background-color: #f8fafc; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // تنظیمات فایربیس شما (حتماً این بخش را با کدهای خودتان جایگزین کنید)
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyDWYO7WRrjFD5IoDUGm91Fih3KE3bHRWa8",
  authDomain: "our-calendar-d7b34.firebaseapp.com",
  databaseURL: "https://our-calendar-d7b34-default-rtdb.firebaseio.com",
  projectId: "our-calendar-d7b34",
  storageBucket: "our-calendar-d7b34.firebasestorage.app",
  messagingSenderId: "76090950691",
  appId: "1:76090950691:web:ac2099a052e4408a43dd96"
};

    // روشن کردن پایگاه داده
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ==========================================
    // آیکون‌ها و صورتک‌های طراحی شده
    // ==========================================
    const ChevronRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>;
    const ChevronLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>;
    const CheckIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6L9 17l-5-5"/></svg>;
    const XIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>;
    const CalendarIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    
    const FaceGood = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
    const FaceBad = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 15s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
    const FaceSad = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M7 8a2 2 0 0 0 4 0"/><path d="M13 8a2 2 0 0 0 4 0"/></svg>;
    const FaceAngry = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M7 8l3 2"/><path d="M17 8l-3 2"/><line x1="9" y1="10" x2="9.01" y2="10"/><line x1="15" y1="10" x2="15.01" y2="10"/></svg>;
    const FaceBored = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
    const FaceHopeless = (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="15" rx="1.5" ry="2"/><line x1="7" y1="9" x2="11" y2="9"/><line x1="13" y1="9" x2="17" y2="9"/></svg>;

    // ==========================================
    // توابع تبدیل تاریخ
    // ==========================================
    function g2j(gy,gm,gd){let g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;let gy2=(gm>2)?(gy+1):gy;let days=(365*gy)+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365;}let jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);let jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd];}
    function j2g(jy,jm,jd){let gy=(jy<=979)?621:1600;jy-=(jy<=979)?0:979;let days=(365*jy)+parseInt(jy/33)*8+parseInt((jy%33+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30+186));gy+=400*parseInt(days/146097);days%=146097;if(days>36524){gy+=100*parseInt(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*parseInt(days/1461);days%=1461;if(days>365){gy+=parseInt((days-1)/365);days=(days-1)%365;}let gd=days+1;let leap=((gy%4===0&&gy%100!==0)||(gy%400===0))?1:0;let g_d_m=[0,31,28+leap,31,30,31,30,31,31,30,31,30,31];let gm=0;while(gm<13&&gd>g_d_m[gm]){gd-=g_d_m[gm];gm++;}return[gy,gm,gd];}

    const persianMonths = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
    const weekDays = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
    const solarEvents = {
      "1-1": [{ title: "عید نوروز", isHoliday: true }],
      "1-2": [{ title: "عید نوروز", isHoliday: true }],
      "1-3": [{ title: "عید نوروز", isHoliday: true }],
      "1-4": [{ title: "عید نوروز", isHoliday: true }],
      "1-12": [{ title: "روز جمهوری اسلامی", isHoliday: true }],
      "1-13": [{ title: "روز طبیعت", isHoliday: true }],
      "9-30": [{ title: "شب یلدا", isHoliday: false }],
      "11-22": [{ title: "پیروزی انقلاب", isHoliday: true }],
      "12-29": [{ title: "ملی شدن صنعت نفت", isHoliday: true }]
    };

    const MOOD_ICONS = {
      'good': { icon: FaceGood, color: 'text-emerald-500', label: 'حال خوب' },
      'bad': { icon: FaceBad, color: 'text-orange-500', label: 'حال بد' },
      'sad': { icon: FaceSad, color: 'text-slate-500', label: 'غمگین' },
      'angry': { icon: FaceAngry, color: 'text-red-600', label: 'عصبی' },
      'bored': { icon: FaceBored, color: 'text-amber-500', label: 'بی‌حوصله' },
      'hopeless': { icon: FaceHopeless, color: 'text-zinc-600', label: 'ناامید' },
    };

    const getDaysInJalaliMonth = (year, month) => {
      if (month <= 6) return 31;
      if (month <= 11) return 30;
      return [1, 5, 9, 13, 17, 22, 26, 30].includes(year % 33) ? 30 : 29;
    };

    const getFirstDayOfWeek = (year, month) => {
      const [gy, gm, gd] = j2g(year, month, 1);
      return (new Date(gy, gm - 1, gd).getDay() + 1) % 7; 
    };

    // ==========================================
    // اپلیکیشن اصلی
    // ==========================================
    function App() {
      const [todayDate, setTodayDate] = useState([]);
      const [viewYear, setViewYear] = useState(1403);
      const [viewMonth, setViewMonth] = useState(1);
      
      const [entries, setEntries] = useState({});
      const [selectedDate, setSelectedDate] = useState(null);
      const [currentNote, setCurrentNote] = useState('');
      const [currentMood, setCurrentMood] = useState(null);
      
      const [isEditorOpen, setIsEditorOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(true);

      useEffect(() => {
        // ورود نامرئی به فایربیس
        auth.signInAnonymously().catch(err => console.log("خطا در ورود:", err));
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setIsSyncing(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const today = new Date();
        const [jy, jm, jd] = g2j(today.getFullYear(), today.getMonth() + 1, today.getDate());
        setTodayDate([jy, jm, jd]);
        setViewYear(jy);
        setViewMonth(jm);
      }, []);

      useEffect(() => {
        if (!user) return;
        setIsSyncing(true);
        // اتصال به دیتابیس مشترک
        const calendarRef = db.collection('calendars').doc('shared');
        const unsubscribe = calendarRef.onSnapshot((doc) => {
          if (doc.exists) {
            setEntries(doc.data().entries || {});
          }
          setIsSyncing(false);
        }, (error) => {
          console.error("خطا در دریافت اطلاعات:", error);
          setIsSyncing(false);
        });
        return () => unsubscribe();
      }, [user]);

      const openEditor = (year, month, day) => {
        setSelectedDate({ year, month, day });
        const dateKey = `${year}-${month}-${day}`;
        const entry = entries[dateKey] || {};
        setCurrentNote(entry.text || '');
        setCurrentMood(entry.mood || null);
        setIsEditorOpen(true);
      };

      const saveNote = async () => {
        if (selectedDate) {
          const dateKey = `${selectedDate.year}-${selectedDate.month}-${selectedDate.day}`;
          const updatedEntries = {
            ...entries,
            [dateKey]: { text: currentNote, mood: currentMood, updatedAt: new Date().toISOString() }
          };
          setEntries(updatedEntries);
          setIsEditorOpen(false);
          
          if (user) {
            db.collection('calendars').doc('shared').set({ entries: updatedEntries }, { merge: true });
          }
        }
      };

      const daysInMonth = getDaysInJalaliMonth(viewYear, viewMonth);
      const firstDayIndex = getFirstDayOfWeek(viewYear, viewMonth);
      const blankDays = Array.from({ length: firstDayIndex }, (_, i) => i);
      const monthDays = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      return (
        <div className="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">
          <div className="w-full max-w-md relative">
            {isSyncing && <div className="absolute top-0 right-0 left-0 text-center text-xs text-indigo-500 bg-indigo-50 py-1 rounded-full">در حال همگام‌سازی...</div>}

            <div className="flex items-center justify-between mb-8 mt-6">
              <div>
                <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                  <span className="text-indigo-600"><CalendarIcon /></span> تقویم مشترک ما
                </h1>
                <p className="text-sm text-slate-500 mt-1">دفترچه خاطرات دو نفره</p>
              </div>
              <button onClick={() => todayDate.length && (setViewYear(todayDate[0]), setViewMonth(todayDate[1]))} className="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-full text-sm font-medium hover:bg-indigo-100 transition">امروز</button>
            </div>

            <div className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-6 mb-6">
              <div className="flex items-center justify-between mb-6">
                <button onClick={() => viewMonth === 1 ? (setViewMonth(12), setViewYear(viewYear - 1)) : setViewMonth(viewMonth - 1)} className="p-2 hover:bg-slate-100 rounded-full"><ChevronRight /></button>
                <h2 className="text-lg font-bold">{persianMonths[viewMonth - 1]} {viewYear}</h2>
                <button onClick={() => viewMonth === 12 ? (setViewMonth(1), setViewYear(viewYear + 1)) : setViewMonth(viewMonth + 1)} className="p-2 hover:bg-slate-100 rounded-full"><ChevronLeft /></button>
              </div>

              <div className="grid grid-cols-7 gap-1 mb-2">
                {weekDays.map((day, idx) => <div key={idx} className="text-center text-xs font-semibold text-slate-400 py-2">{day}</div>)}
              </div>

              <div className="grid grid-cols-7 gap-1 md:gap-2">
                {blankDays.map(blank => <div key={`blank-${blank}`} className="aspect-square"></div>)}
                {monthDays.map(day => {
                  const isToday = todayDate[0] === viewYear && todayDate[1] === viewMonth && todayDate[2] === day;
                  const dateKey = `${viewYear}-${viewMonth}-${day}`;
                  const entry = entries[dateKey];
                  const hasEntryText = !!(entry && entry.text);
                  const entryMood = entry?.mood;
                  const isSelected = selectedDate?.year === viewYear && selectedDate?.month === viewMonth && selectedDate?.day === day;
                  const isFriday = (firstDayIndex + day - 1) % 7 === 6;
                  const dayEvents = solarEvents[`${viewMonth}-${day}`] || [];
                  const isEventHoliday = dayEvents.some(e => e.isHoliday);
                  const isHoliday = isFriday || isEventHoliday;
                  const hasOccasion = dayEvents.length > 0;

                  let btnClasses = "relative flex flex-col items-center justify-center aspect-square rounded-2xl text-sm font-medium transition-all ";
                  if (isSelected) btnClasses += isHoliday ? "bg-red-500 text-white shadow-md shadow-red-200 " : "bg-indigo-600 text-white shadow-md shadow-indigo-200 ";
                  else {
                    btnClasses += isHoliday ? "text-red-500 " : "text-slate-700 ";
                    btnClasses += (hasEntryText || entryMood) ? "bg-slate-100 " : "hover:bg-slate-100 ";
                    if (isToday) btnClasses += "border-2 border-indigo-500 ";
                  }

                  const MoodIconRender = entryMood && MOOD_ICONS[entryMood] ? MOOD_ICONS[entryMood].icon : null;
                  const moodColor = entryMood && MOOD_ICONS[entryMood] ? MOOD_ICONS[entryMood].color : '';

                  return (
                    <button key={day} onClick={() => openEditor(viewYear, viewMonth, day)} className={btnClasses}>
                      {MoodIconRender ? (
                        <div className="flex flex-col items-center justify-center w-full h-full">
                          <MoodIconRender className={`w-6 h-6 mb-0.5 ${isSelected ? 'text-white' : moodColor}`} />
                          <span className="text-[10px] leading-none font-bold opacity-80">{day}</span>
                        </div>
                      ) : <span>{day}</span>}
                      <div className="absolute bottom-1 flex gap-1">
                        {hasEntryText && <span className={`w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-indigo-500'}`}></span>}
                        {hasOccasion && <span className={`w-1 h-1 rounded-full ${isSelected ? 'bg-white/70' : (isHoliday ? 'bg-red-300' : 'bg-amber-400')}`}></span>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {isEditorOpen && (
              <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 backdrop-blur-sm p-4 sm:items-center">
                <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
                  <div className="flex justify-between items-start mb-4">
                    <h3 className="font-bold text-lg text-slate-800">یادداشت روز {selectedDate?.day} {persianMonths[selectedDate?.month - 1]}</h3>
                    <button onClick={() => setIsEditorOpen(false)} className="p-2 hover:bg-slate-100 rounded-full"><XIcon /></button>
                  </div>
                  
                  <div className="mb-5">
                    <label className="text-sm font-medium text-slate-600 mb-2 block">حال و هوای امروز:</label>
                    <div className="flex flex-wrap gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-100 justify-center">
                      {Object.entries(MOOD_ICONS).map(([key, config]) => {
                        const Icon = config.icon;
                        const isSelected = currentMood === key;
                        return (
                          <button key={key} onClick={() => setCurrentMood(isSelected ? null : key)} className={`p-2 rounded-xl transition-all duration-200 flex flex-col items-center justify-center ${isSelected ? 'bg-white ring-2 ring-indigo-500 scale-110 shadow-md' : 'hover:bg-slate-200 opacity-60 hover:opacity-100'}`} title={config.label}>
                            <Icon className={`w-7 h-7 ${config.color}`} />
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <textarea value={currentNote} onChange={(e) => setCurrentNote(e.target.value)} placeholder="امروز چه کارهایی انجام دادی؟ چطور گذشت؟..." className="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-2xl resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-sm"></textarea>
                  
                  <button onClick={saveNote} className="w-full py-3 bg-indigo-600 text-white rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700">
                    <CheckIcon /> ثبت یادداشت
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
